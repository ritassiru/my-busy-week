<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6D2E46">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Busy Week">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F0E6; --panel: #FFFDF8; --ink: #2B1721; --muted: #6E5C63; --berry: #6D2E46; --rose: #A26769;
  --cream: #ECE2D0; --line: #D9CBBE; --ok: #3E8E6B; --gold: #C08A2E; --bad: #B0413E; --btn-text: #FFFFFF; --msg: #E3EEF3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1; --berry: #C77A98; --rose: #D19A9C;
    --cream: #3A2830; --line: #4A3540; --ok: #62B891; --gold: #E0AE55; --bad: #E07571; --btn-text: #1E1318; --msg: #243540;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1; --berry: #C77A98; --rose: #D19A9C;
  --cream: #3A2830; --line: #4A3540; --ok: #62B891; --gold: #E0AE55; --bad: #E07571; --btn-text: #1E1318; --msg: #243540;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 1.125rem; line-height: 1.55; }
/* tamanho do texto (configurações): tudo em rem acompanha */
:root[data-size="lg"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 36px; }
h1, h2, h3, .ch-title, .brand { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 800; letter-spacing: -0.01em; }
h1 { font-size: 2.2rem; line-height: 1.05; margin: 0 0 6px; color: var(--berry); }
h2 { font-size: 1.6rem; line-height: 1.15; margin: 0 0 10px; color: var(--berry); }
p { margin: 0 0 12px; }
.hint { color: var(--muted); font-size: 0.95rem; }
button { font: inherit; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.brand { font-size: 1.05rem; color: var(--berry); }
.step { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
.top.top2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.top2 .gear { justify-self: end; }
.top.bar { align-items: center; }
.gear { flex: none; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; cursor: pointer; color: var(--berry); background: none; border: 1.5px solid var(--line); border-radius: 999px; margin-left: auto; }
.gear svg { width: 22px; height: 22px; }
.gear:hover { border-color: var(--rose); }
.no-gloss .gloss { text-decoration: none; cursor: inherit; pointer-events: none; }

/* configurações */
#settings { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 10, 15, 0.55); overflow-y: auto; }
.sheet { width: 100%; max-width: 440px; margin: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px; }
.sheet h2 span { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-weight: 400; font-size: 1rem; color: var(--muted); letter-spacing: 0; }
.st-g { margin-bottom: 14px; }
.st-h { font-size: 0.88rem; color: var(--muted); margin: -2px 0 6px; }
.sheet .chip[aria-pressed="true"] b::before { content: "✓ "; color: var(--berry); }
.btn span { font-weight: 400; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--berry); }

/* glossário */
.gloss { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: underline dotted var(--rose); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.gloss.verb { text-decoration-style: dashed; text-decoration-color: var(--berry); }
/* nível Beginner (A1): sublinhado mais leve, para não pesar o texto */
.gloss.a1 { text-decoration-thickness: 1.5px; text-decoration-color: var(--muted); }
:root:not(.gloss-a1) .gloss.a1 { text-decoration: none; cursor: inherit; pointer-events: none; }
.opt-pt { display: none; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.gloss-a1 .opt-pt { display: block; }
.seq .gloss { font-weight: inherit; color: inherit; }
.nw { white-space: nowrap; }
#tip { position: absolute; z-index: 20; max-width: 280px; display: none; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.95rem; padding: 6px 10px; border-radius: 8px; }
#tip.on { display: block; }
#tip .vt { display: grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 4px 14px; }
#tip .vc { padding: 2px 6px; border-radius: 6px; border: 2px solid transparent; }
#tip .vc.on { border-color: var(--gold); }
#tip .vc span { display: block; font-size: 0.72rem; opacity: .8; }
#tip .vpt { margin-top: 6px; }
.choices { display: grid; gap: 10px; margin-top: 8px; }
.choose-t { font-family: "Fraunces", Georgia, serif; font-weight: 800; color: var(--berry); font-size: 1.2rem; margin: 4px 0 6px; }
.btn { display: block; width: 100%; text-align: left; cursor: pointer; padding: 14px 16px; border-radius: 12px; font-size: 1.06rem; font-weight: 700; background: var(--panel); color: var(--berry); border: 2px solid var(--berry); }
.btn.primary { background: var(--berry); color: var(--btn-text); text-align: center; }
.btn.center { text-align: center; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .opt:focus-visible, .gloss:focus-visible, .gear:focus-visible, .chip:focus-visible, .help-btn:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.kw-g { font-weight: 700; margin: 14px 0 6px; } .kw-g span { font-weight: 400; color: var(--muted); }
.kw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kw { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.kw-e { font-size: 1.25rem; } .kw b { display: block; } .kw span.pt { display: block; font-size: .8rem; color: var(--muted); line-height: 1.2; }

.sent { margin-bottom: 14px; }
label.lbl { display: block; font-weight: 700; margin-bottom: 6px; }
textarea { width: 100%; font: inherit; font-size: 1.02rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 64px; resize: vertical; }
.tag { font-weight: 400; font-size: .78rem; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rose); color: var(--rose); white-space: nowrap; }
.help-btn { display: block; text-align: left; margin-top: 4px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--berry); font-weight: 700; font-size: .98rem; text-decoration: underline; text-underline-offset: 3px; }
.help-btn span, .step-t span, .grp span { font-weight: 400; color: var(--muted); }
.own { font-size: .92rem; color: var(--muted); margin: 6px 0 0; padding-left: 10px; border-left: 3px solid var(--gold); }
.builder { margin-top: 8px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); }
.step-t { font-weight: 700; margin: 10px 0 6px; } .step-t:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { cursor: pointer; text-align: left; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); line-height: 1.25; }
.chip b { display: block; font-size: .98rem; } .chip span { display: block; font-size: .8rem; color: var(--muted); }
.chip.on, .chip[aria-pressed="true"] { border-color: var(--berry); background: var(--cream); }
.pv-bar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); margin: 14px -12px -12px; padding: 10px 12px 12px; background: var(--bg); border-top: 2px solid var(--line); border-radius: 0 0 10px 10px; }
.preview { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--cream); font-size: 1.05rem; min-height: 2.6em; }
.done { font-weight: 700; color: var(--ok); margin: 12px 0 0; }
.again-hint { text-align: center; margin: 8px 0 0; }
/* My words */
.wlist { list-style: none; padding: 0; margin: 4px 0 8px; }
.wlist li { padding: 6px 0; border-top: 1px solid var(--line); }
.wlist li:first-child { border-top: 0; }
.wlist li span { color: var(--muted); }
.wcard { text-align: center; padding: 22px 12px; margin: 6px 0 12px; border: 2px dashed var(--rose); border-radius: 14px; background: var(--bg); }
.wcard b { display: block; font-family: "Fraunces", Georgia, serif; font-size: 1.6rem; color: var(--berry); line-height: 1.2; }
.wcard span { display: block; margin-top: 8px; font-size: 1.1rem; }
.wbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* áudio */
.say { display: none; align-items: center; gap: 6px; font: inherit; font-size: 0.88rem; font-weight: 700; color: var(--berry); background: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; margin: 0 0 10px; cursor: pointer; }
.say span { font-weight: 400; }
.can-speak .say { display: inline-flex; }
.say[aria-pressed="true"] { border-color: var(--berry); background: var(--cream); }
.say:focus-visible { outline: 3px solid var(--gold, var(--rep)); outline-offset: 2px; }
.wcard + .say { margin: -4px auto 12px; }

.wbtns .btn { text-align: center; }
.wscore { font-weight: 700; font-size: 1.15rem; color: var(--berry); }
.wscore span { font-weight: 400; font-size: 0.95rem; color: var(--muted); }
.resume { font-weight: 700; color: var(--bad); margin: 0 0 10px; padding: 8px 10px; border: 2px solid var(--bad); border-radius: 10px; }
.past-list { list-style: none; padding: 0; margin: 0 0 6px; }
.past-list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.past-list .pe { font-size: 1.4rem; width: 1.8rem; text-align: center; } .past-list .pm { font-size: .85rem; color: var(--muted); }
.cover-t { text-align: center; padding: 6px 4px 2px; }
.cover-t .lvl { display: inline-block; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--rose); border: 1px solid var(--rose); border-radius: 999px; padding: 1px 10px; margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.no-motion * { transition: none !important; animation: none !important; }

/* estante */
.shelf-head { text-align: center; margin: 6px 0 14px; }
.shelf-head h1 { margin-bottom: 2px; }
.shelf-plank { height: 10px; background: linear-gradient(#8E6A55, #6B4A32); border-radius: 3px; margin: -4px 4px 18px; box-shadow: 0 3px 6px rgba(43,23,33,.2); }
.back { background: none; border: 0; color: var(--berry); font-weight: 700; cursor: pointer; padding: 4px 0; margin-bottom: 6px; text-decoration: underline; text-underline-offset: 3px; }
.locked-note { font-size: .88rem; color: var(--bad); margin: 0 0 6px; }
.fb { font-size: 0.95rem; margin-top: 8px; min-height: 1.3em; }
.fb.ok { color: var(--ok); font-weight: 700; } .fb.no { color: var(--bad); }
.sec-t { font-weight: 700; margin: 16px 0 8px; } .sec-t span { font-weight: 400; color: var(--muted); }
.score { font-size: 1.15rem; font-weight: 700; color: var(--berry); }
/* ---------------- celular ---------------- */
.phone { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(43,23,33,.08); }
.ph-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--cream); border-bottom: 1px solid var(--line); }
.ph-head .ph-ico { font-size: 1.4rem; line-height: 1; }
.ph-head b { display: block; line-height: 1.2; }
.ph-head small { color: var(--muted); font-size: .82rem; }
.ph-body { padding: 12px 12px 14px; }
.chat { display: grid; gap: 8px; margin-bottom: 4px; }
.bub { max-width: 86%; padding: 8px 12px; border-radius: 16px; background: var(--msg); font-size: 1.04rem; line-height: 1.45; }
.bub.in { justify-self: start; border-bottom-left-radius: 4px; }
.bub.out { justify-self: end; background: var(--berry); color: var(--btn-text); border-bottom-right-radius: 4px; }
.bub.out .gloss { text-decoration-color: var(--btn-text); }
.bub .who { display: block; font-size: .78rem; font-weight: 700; margin-bottom: 1px; }
.appear { animation: pop .35s both; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.task-pt { font-size: .98rem; margin: 12px 0 8px; padding: 8px 10px; border-left: 4px solid var(--gold); background: var(--bg); border-radius: 0 10px 10px 0; }
.keyb { display: inline-block; font-size: .8rem; font-weight: 700; color: var(--berry); border: 1.5px solid var(--berry); border-radius: 999px; padding: 1px 10px; margin: 0 0 6px; }
.ans { min-height: 3.2em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
.ans .empty { color: var(--muted); font-size: .92rem; }
.blks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.blk, .tok { cursor: pointer; font: inherit; font-weight: 700; font-size: 1rem; padding: 7px 11px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
.tok { border-color: var(--berry); background: var(--cream); }
.blk:disabled { opacity: .3; cursor: default; }
.blk:focus-visible, .tok:focus-visible, .appbar button:focus-visible, .av:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.row2 .btn { text-align: center; }
.fbk { border-radius: 12px; padding: 12px 14px; margin: 12px 0; border: 2px solid var(--line); background: var(--bg); }
.fbk.ok { border-color: var(--ok); } .fbk.warn { border-color: var(--gold); } .fbk.bad { border-color: var(--bad); }
.fbk-t { font-weight: 700; margin: 0 0 4px; }
.fbk .model { margin: 8px 0 0; font-size: .95rem; } .fbk .model b { color: var(--berry); }
.appbar { display: flex; justify-content: space-around; border-top: 1px solid var(--line); background: var(--cream); padding: 4px; }
.appbar button { font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 0; border-radius: 10px; padding: 4px 10px; cursor: pointer; display: grid; justify-items: center; line-height: 1.2; }
.appbar button span { font-size: 1.3rem; }
.appbar button.on { color: var(--berry); font-weight: 700; }
.lock { text-align: center; color: #FFF6EE; background: linear-gradient(160deg, #3A2830, #6D2E46 70%, #A26769); border-radius: 22px; padding: 26px 14px 18px; margin-bottom: 14px; }
.lock .clock { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 3.4rem; line-height: 1; }
.lock .date { margin: 4px 0 18px; opacity: .9; }
.notif { display: flex; gap: 10px; align-items: center; text-align: left; background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.notif .ni { font-size: 1.4rem; } .notif b { display: block; } .notif span { font-size: .92rem; opacity: .9; }
.notes-l { list-style: none; padding: 0; margin: 0; }
.notes-l li { padding: 8px 0 8px 30px; border-top: 1px solid var(--line); position: relative; }
.notes-l li:first-child { border-top: 0; }
.notes-l li::before { content: "☐"; position: absolute; left: 4px; color: var(--berry); }
.notes-l li.new::after { content: "new"; margin-left: 8px; font-size: .72rem; font-weight: 700; color: var(--berry); border: 1px solid var(--berry); border-radius: 999px; padding: 0 6px; }
.cal-l { list-style: none; padding: 0; margin: 0; }
.cal-l li { padding: 8px 10px; border-left: 4px solid var(--berry); background: var(--bg); border-radius: 0 10px 10px 0; margin-bottom: 6px; }
.avatar svg { display: block; width: 120px; height: 120px; margin: 0 auto; }
.av-g { margin-bottom: 12px; }
.av-row { display: flex; flex-wrap: wrap; gap: 8px; }
.av { width: 40px; height: 40px; border-radius: 999px; border: 3px solid var(--line); cursor: pointer; padding: 0; font: inherit; background: var(--panel); color: var(--ink); }
.av.txt { width: auto; padding: 0 12px; font-size: .9rem; }
.av[aria-pressed="true"] { border-color: var(--berry); box-shadow: 0 0 0 2px var(--berry); }
input.name { width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ev-card .scene svg { display: block; width: 100%; height: auto; border-radius: 10px; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.3rem; font-weight: 700; letter-spacing: .06em; color: var(--berry); }
.home-av svg { width: 90px; height: 90px; display: block; margin: 0 auto 4px; }
.kwbtn { font-size: 1.15rem; line-height: 1; }
.kwbtn + .gear { margin-left: 0; }
.top.bar { gap: 8px; }
.stamp { display: inline-block; font-weight: 700; color: var(--ok); border: 2px solid var(--ok); border-radius: 999px; padding: 2px 12px; margin-bottom: 8px; }
</style>

<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="tip" role="tooltip"></div>
<div id="settings" hidden></div>
<script>
const GAME = __GAME__;      // { title, subtitle, codes, events: [ { slug, meta, days } ] } (os padrões de resposta já vêm expandidos pelo build.py)
const A1 = __A1__;         // glossário Beginner (fonte/a1.json): palavra -> "tradução" ou "forma base|tradução"
const IRREG = __IRREG__;   // [infinitive, past, participle, tradução]; o balão mostra infinitive e past

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const smooth = () => (document.documentElement.classList.contains("no-motion") || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } }
};
/* armazenamento: configurações iguais às da estante (mesmo site); o jogo e as palavras ficam em week:* */
const KEY = { gloss: "reader:gloss", theme: "reader:theme", size: "reader:size", motion: "reader:motion", audio: "reader:audio", words: "week:words", profile: "week:profile", run: "week:run" };
const book = null;   // o jogo não tem "livros": os verbos mostram infinitive e past (verbForms 2)

/* verbos irregulares: forma escrita -> { i, cols }; cols: 0 = infinitive, 1 = past, 2 = participle.
   VERB3 também reconhece os particípios; é usado pelos livros com "verbForms": 3 nos metadados. */
const VERB = new Map(), VERB3 = new Map();
[VERB, VERB3].forEach(VERB => {
  const NO_BASE = new Set(["have", "do"]);
  const DOUBLE = new Set(["get", "run", "win", "put", "cut", "set", "let", "begin", "sit", "forget"]);
  const sForm = b => /(s|sh|ch|x|o)$/.test(b) ? b + "es" : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + "ies" : b + "s";
  const ing = b => (b === "be" || b === "see") ? b + "ing" : DOUBLE.has(b) ? b + b.slice(-1) + "ing" : /ie$/.test(b) ? b.slice(0, -2) + "ying" : /[^e]e$/.test(b) ? b.slice(0, -1) + "ing" : b + "ing";
  const add = (k, i, col) => { if (!VERB.has(k)) VERB.set(k, { i, cols: [] }); if (col !== null && !VERB.get(k).cols.includes(col)) VERB.get(k).cols.push(col); };
  IRREG.forEach(([b, p, pp], i) => {
    if (!NO_BASE.has(b)) { add(b, i, 0); if (b !== "be") add(sForm(b), i, 0); add(ing(b), i, null); }
    p.split(" / ").forEach(f => add(f, i, 1));

/* ---------------- futuro no balão ----------------
   A mesma regra está em checar.py (WILL, GOING_TO, TIME, BE_ING, NOT_ING): se mudar aqui, mude lá.
   - 'll / will / won't + verbo: decisão, promessa ou opinião
   - going to + verbo: plano ou sinal ("going to school" continua sendo o verbo go)
   - am/is/are + -ing COM expressão de tempo na mesma frase: compromisso marcado.
     Sem expressão de tempo, o -ing quer dizer "agora" e fica sem esse balão. */
const GOING_TO = /\b(going to)(?=\s+(?!(?:the|a|an|my|your|his|her|its|our|their|this|that|these|those|school|bed|sleep|work|church|class|town|home)\b)[a-z])/i;
const WILL = /\b([A-Za-z]+['’]ll|will|won['’]t)\b(?=\s+(?:not\s+)?[a-z])/i;
const TIME = /\b(?:tonight|tomorrow|this (?:morning|afternoon|evening|weekend)|next (?:week|weekend|year|monday|tuesday|wednesday|thursday|friday|saturday|sunday)|on (?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)|in the (?:morning|afternoon|evening)|at \d{1,2}(?::\d\d)?)\b/i;
const BE_ING = /((?:\b(?:am|is|are)|['’](?:m|s|re))\s+)([a-z]+ing)\b/gi;

function markFuture(text) {

  const marked = masked.replace(/[^.!?]+[.!?]*/g, s => TIME.test(s) ? s.replace(BE_ING, (m, be, ing, off, str) =>
    NOT_ING.has(ing.toLowerCase()) || (ing.toLowerCase() === "going" && GOING_TO.test(str.slice(off + be.length))) ? m : be + "" + ing + "") : s);

const futBtn = (txt, pt, base) => `<button type="button" class="gloss" data-pt="${esc(pt)}"${base ? ` data-base="${esc(base)}"` : ""}>${esc(txt)}</button>`;
function verbWrap(plain) {
  const ing = plain.split(/([^]+)/);
  if (ing.length > 1) return ing.map((part, i) => i % 2 ? futBtn(part, FUT_PT.ing) : verbWrap(part)).join("");
  const will = plain.split(WILL);
  if (will.length > 1) return will.map((part, i) => {
    if (!(i % 2)) return verbWrap(part);
    const wont = /^won/i.test(part);
    return futBtn(part, wont ? FUT_PT.wont : FUT_PT.will, wont ? "will not" : /ll$/i.test(part) ? part.replace(/['’]ll$/i, " will") : "");

  const future = plain.split(GOING_TO);
  if (future.length > 1) return future.map((part, i) => i % 2 ? futBtn(part, FUT_PT.going) : verbWrap(part)).join("");

    if (i % 2 === 0) return esc(part);

    const a = A1[key];
    if (!a) return esc(part);
    const [base, pt] = a.includes("|") ? a.split("|") : ["", a];

  }).join("");
}

/* ---------------- áudio: a voz em inglês que já vem no celular (nada é baixado nem enviado) ---------------- */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voz = null, falando = null;   // falando: o botão 🔊 que está lendo agora
function escolheVoz() {
  if (!synth) return null;
  const vs = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
  // vozes do próprio aparelho primeiro (funcionam sem internet)
  return vs.find(v => v.localService && /en[-_](US|GB)/i.test(v.lang)) || vs.find(v => v.localService) || vs[0] || null;
}
const podeFalar = () => !!(synth && (voz = voz || escolheVoz()));
if (synth) synth.addEventListener("voiceschanged", () => { voz = escolheVoz(); applySettings(); });
// texto que vai para a voz: sem [[glossário]], sem emojis, com o nome da empresa; "go · went" vira "go, went"
const paraFalar = t => String(t).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, "$1").replace(/\{name\}/g, (typeof state !== "undefined" && state && state.name) || "")
  .replace(/\p{Extended_Pictographic}|️|‍/gu, "").replace(/\s·\s/g, ", ").replace(/\s+/g, " ").trim();
// divide em frases só onde há pontuação seguida de espaço ("8.5" fica inteiro) e não depois de Mr./Ms./Dr. nem antes de minúscula (“Why?” she asked)
function frases(t) {
  const out = [];
  t.split(/([.!?]+[”"’]?\s+)/).forEach((x, i) => {
    if (i % 2) { out[out.length - 1] += x; return; }
    const ant = out[out.length - 1];
    if (ant !== undefined && (/\b(Mr|Ms|Mrs|Dr)\.\s*$/.test(ant) || /^[a-z]/.test(x))) out[out.length - 1] += x; else out.push(x);
  });
  return out.map(x => x.trim()).filter(Boolean);
}
function fala(texto, botao) {
  if (!podeFalar() || SET.audio === "off") return;
  try {
    synth.cancel(); paraBotao();
    // frase por frase: alguns navegadores cortam leituras longas no meio
    const partes = frases(paraFalar(texto));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.voice = voz; u.lang = voz.lang; u.rate = SET.audio === "slow" ? 0.7 : 0.95;
      if (botao && i === partes.length - 1) { u.onend = u.onerror = () => { if (falando === botao) paraBotao(); }; }
      synth.speak(u);
    });
    if (botao) { falando = botao; botao.setAttribute("aria-pressed", "true"); botao.querySelector("span").textContent = "Stop · parar"; }
  } catch (e) { /* sem voz: o jogo funciona igual */ }
}
function paraBotao() {
  if (!falando) return;
  falando.setAttribute("aria-pressed", "false");
  const s = falando.querySelector("span"); if (s) s.textContent = "Listen · ouvir";
  falando = null;
}
const sayButton = t => `<button type="button" class="say" data-say="${esc(paraFalar(t))}" aria-pressed="false" aria-label="Listen · ouvir o texto">🔊 <span>Listen · ouvir</span></button>`;
document.addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (!b) return;
  if (b.getAttribute("aria-pressed") === "true") { try { synth.cancel(); } catch (err) { /* nada */ } paraBotao(); return; }
  fala(b.dataset.say, b);
});

  // aparece sempre, mesmo vazio, para o aluno descobrir o recurso
  return `<div class="card" id="w-home"><p class="sec-t" style="margin-top:0">My words <span>· minhas palavras</span></p>
    ${n ? `<p class="hint">${n} ${n === 1 ? "palavra consultada" : "palavras consultadas"} no glossário, guardadas neste aparelho.</p>${reviewButton()}`
         : `<p class="hint">Toque nas palavras sublinhadas durante o jogo: elas ficam guardadas aqui para você revisar depois.</p>`}</div>`;
}

// revisão em cartões, no mesmo painel das configurações (não mexe no jogo)
let rv = null;
function openWords() {
  const ws = loadWords().sort((a, b) => (a.ok - b.ok) || (b.t - a.t));   // as que ainda não sabe vêm primeiro
  rv = { deck: ws.slice(0, 10), i: 0, ok: 0, shown: false, armed: false };
  openSheet(wordsHTML());
}
function wordsHTML() {
  const all = loadWords(), head = `<h2 id="st-t">My words <span>· minhas palavras</span></h2>`;
  const done = `<button type="button" class="btn primary" id="st-close">Done <span>· pronto</span></button>`;
  if (!all.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p>Toque nas palavras sublinhadas durante o jogo: elas aparecem aqui para você revisar.</p>${done}</div>`;
  if (rv.i >= rv.deck.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="wscore">You knew ${rv.ok} of ${rv.deck.length}! <span>· você sabia ${rv.ok} de ${rv.deck.length}</span></p>
    <div class="choices"><button type="button" class="btn center" id="w-again">Review again <span>· revisar de novo</span></button></div>
    <p class="sec-t">All my words <span>· todas as minhas palavras (${all.length})</span></p>${wordsList(all)}
    <button type="button" class="help-btn" id="w-clear">${rv.armed ? "Tap again to delete <span>· toque de novo para apagar</span>" : "Clear my words <span>· apagar minhas palavras</span>"}</button>
    <div class="choices">${done}</div></div>`;
  const w = rv.deck[rv.i];
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="hint">Card ${rv.i + 1} of ${rv.deck.length} · cartão ${rv.i + 1} de ${rv.deck.length}</p>
    <div class="wcard" aria-live="polite"><b>${esc(w.en)}</b>${rv.shown ? `<span>= ${esc(w.pt)}</span>` : `<span class="hint">O que significa? · What does it mean?</span>`}</div>${sayButton(w.en)}
    ${rv.shown ? `<div class="wbtns"><button type="button" class="btn primary" id="w-yes">I knew it ✓ <span>· eu sabia</span></button>
      <button type="button" class="btn center" id="w-no">Not yet ↻ <span>· ainda não</span></button></div>`
      : `<button type="button" class="btn primary" id="w-show">Show the translation <span>· ver a tradução</span></button>`}
    <div class="choices">${done.replace("btn primary", "btn center")}</div></div>`;
}
function redrawWords(focusId) {
  $("#settings").innerHTML = wordsHTML();
  const f = (focusId && $("#" + focusId)) || $("#settings .sheet button");
  if (f) f.focus();
}
function wordsClick(e) {
  const b = e.target.closest("#w-show, #w-yes, #w-no, #w-again, #w-clear");
  if (!b) return false;
  if (b.id === "w-show") { rv.shown = true; redrawWords("w-yes"); }
  else if (b.id === "w-yes" || b.id === "w-no") {
    const ws = loadWords(), w = ws.find(x => x.k === rv.deck[rv.i].k);
    if (w) { w.ok = b.id === "w-yes" ? w.ok + 1 : 0; saveWords(ws); }
    if (b.id === "w-yes") rv.ok++;
    rv.i++; rv.shown = false; redrawWords("w-show");
  }
  else if (b.id === "w-again") openWords();
  else if (b.id === "w-clear") {
    if (rv.armed) { saveWords([]); rv.armed = false; redrawWords(); }
    else { rv.armed = true; redrawWords("w-clear"); setTimeout(() => { if (rv && rv.armed) { rv.armed = false; if (!$("#settings").hidden && $("#w-clear")) redrawWords("w-clear"); } }, 4000); }
  }
  return true;
}

/* ---------------- glossário: balão e 1ª ocorrência ---------------- */
document.addEventListener("click", e => {
  const tip = $("#tip"), g = e.target.closest(".gloss");
  if (!g || !glossOn || (g.classList.contains("a1") && SET.gloss !== "a1")) { tip.classList.remove("on"); return; }
  if (g.classList.contains("verb")) {
    const [b, p, pp, pt] = IRREG[+g.dataset.v], on = g.dataset.cols ? g.dataset.cols.split(",").map(Number) : [];
    tip.innerHTML = `<div class="vt">${[["infinitive", b], ["past", p], ["participle", pp]].slice(0, verbForms()).map(([l, f], i) => `<div class="vc${on.includes(i) ? " on" : ""}"><span>${l}</span><b>${esc(f)}</b></div>`).join("")}</div><div class="vpt">= ${esc(pt)}</div>`;
    rememberWord("v:" + b, [b, p, pp].slice(0, verbForms()).join(" · "), pt);
  } else { tip.textContent = g.textContent + (g.dataset.base ? ` (${g.dataset.base})` : "") + " = " + g.dataset.pt; rememberWord("g:" + wordOf(g), wordOf(g), g.dataset.pt); }
  tip.classList.add("on");
  fala(g.textContent);
  const r = g.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8)) + "px";
  const above = r.top - tip.offsetHeight - 6;
  tip.style.top = (window.scrollY + (above > 8 ? above : r.bottom + 6)) + "px";
});
function dedupeGloss() {
  const seen = new Set(), all = [...$("#app").querySelectorAll(".gloss")];
  const word = el => el.textContent.trim().toLowerCase();
  // uma palavra do glossário normal nunca perde a vez para a mesma palavra do nível A1
  const normal = new Set(all.filter(el => !el.classList.contains("a1") && !el.classList.contains("verb")).map(word));
  all.forEach(el => {
    const a1 = el.classList.contains("a1");
    const key = (el.classList.contains("verb") ? "v:" : a1 ? "a:" : "g:") + word(el);
    if (seen.has(key) || (a1 && normal.has(word(el)))) el.replaceWith(...el.childNodes); else seen.add(key);
  });
  glossTabs();
}
// palavras do nível A1 só entram na ordem do Tab quando esse nível está ligado
function glossTabs() {
  const on = SET.gloss === "a1";
  document.querySelectorAll(".gloss.a1").forEach(el => { el.tabIndex = on ? 0 : -1; });
}
new MutationObserver(dedupeGloss).observe($("#app"), { childList: true, subtree: true });

screenHome();
</script>
